name: Build Windows EXE

on:
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name OpenElectribeEditor \
            --collect-all PyQt6 \
            --collect-all qtawesome \
            --collect-all sounddevice \
            --add-data "ui/locales;ui/locales" \
            main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenElectribeEditor-windows-exe
          path: dist/OpenElectribeEditor.exe
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/OpenElectribeEditor.exe \
            --title "${{ github.ref_name }}" \
            --generate-notes \
          || gh release upload "${{ github.ref_name }}" dist/OpenElectribeEditor.exe --clobber
